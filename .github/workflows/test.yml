name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install terminal test dependency
        run: brew install tmux
      - name: Python regressions
        run: python -m unittest discover -s tests -v
      - name: Frontend regressions
        run: node --test tests/test_frontend.cjs
      - name: Public tree checks
        run: python scripts/check_public.py --release
