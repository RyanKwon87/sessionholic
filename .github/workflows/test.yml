name: Test
on:
  # A pull request's commits run once (as the pull request), main once after each merge: a
  # branch push as well ran every commit twice, and a failure mailed twice.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install terminal test dependency
        run: brew install tmux
      - name: Python regressions
        run: python -m unittest discover -s tests -v
      - name: Frontend regressions
        run: node --test tests/test_*.cjs
      - name: Public tree checks
        run: python scripts/check_public.py --release
